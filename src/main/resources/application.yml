server:
  port: 8080

spring:
  application:
    name: crocante-backend

  # Conexión a PostgreSQL. Cada valor puede cambiarse con una variable de entorno (DB_URL, DB_USER, DB_PASSWORD).
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crocante}
    username: ${DB_USER:crocante}
    password: ${DB_PASSWORD:crocante}

  jpa:
    # Las tablas las crea Flyway, no Hibernate. Hibernate solo comprueba que coincidan con las entidades.
    hibernate:
      ddl-auto: validate
    open-in-view: false

# Registro de eventos (logs): nivel INFO en general y DEBUG solo para nuestro código.
# org.hibernate.SQL muestra en consola las sentencias SQL que Hibernate envía a PostgreSQL.
logging:
  level:
    root: INFO
    cl.ipsb.crocante: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

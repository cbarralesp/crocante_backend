# Las pruebas automáticas usan una base en memoria (H2 en modo PostgreSQL): no necesitan PostgreSQL instalado.
spring:
  datasource:
    url: jdbc:h2:mem:crocante;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
